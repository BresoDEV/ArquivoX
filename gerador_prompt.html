<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Depósito de Prompts</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #121212;
      color: #f1f1f1;
      padding: 30px;
    }

    h1 {
      margin-bottom: 25px;
      font-size: 28px;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: #1e1e1e;
      border: 1px solid #2d2d2d;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .titulo {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #ffffff;
    }

    textarea {
      width: 100%;
      height: 140px;
      background: #0f0f0f;
      color: #dcdcdc;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      resize: vertical;
      margin-bottom: 12px;
      outline: none;
    }

    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
      font-weight: bold;
    }

    button:hover {
      background: #2563eb;
    }

    .copiado {
      background: #16a34a !important;
    }
  </style>
</head>
<body>

<br>
<h1>📁 DigenAI Bypass</h1>
<br>
<div class="container">
<textarea>
 const classes = [
  'size-full',
  'flex-center',
  'absolute',
  'inset-0',
  'bg-#0e0f10/90',
  'backdrop-blur-7.5px',
  'z-999'
];

document.querySelectorAll('*').forEach(el => {
  if (classes.every(c => el.classList.contains(c))) {
    el.classList.remove(...classes);
  }
});


const imagens = [...document.querySelectorAll("img")]
    .map(img => img.src)
    .filter(src => src.includes("wasabisys"));

const novaJanela = window.open();

novaJanela.document.write(`
    <html>
    <body>
        ${imagens.map(src => `
            <img src="${src}" style="max-width:300px;">
        `).join("")}
    </body>
    </html>
`);
</textarea></div>

    const container = document.getElementById("container");

    prompts.forEach((item, index) => {

      // CARD
      const card = document.createElement("div");
      card.className = "card";

      // TÍTULO
      const titulo = document.createElement("div");
      titulo.className = "titulo";
      titulo.innerText = item.nome;

      // TEXTAREA
      const textarea = document.createElement("textarea");
      textarea.value = item.valor;
      textarea.readOnly = true;

      // BOTÃO
      const botao = document.createElement("button");
      botao.innerText = "Copiar Prompt";

      botao.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(textarea.value);

          botao.innerText = "Copiado!";
          botao.classList.add("copiado");

          setTimeout(() => {
            botao.innerText = "Copiar Prompt";
            botao.classList.remove("copiado");
          }, 2000);

        } catch (erro) {
          alert("Erro ao copiar.");
        }
      });

      // APPEND
      card.appendChild(titulo);
      card.appendChild(textarea);
      card.appendChild(botao);

      container.appendChild(card);
    });
