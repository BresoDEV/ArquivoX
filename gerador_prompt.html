    * {

      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #121212;
      color: #f1f1f1;
      padding: 30px;
    }

    h1 {
      margin-bottom: 25px;
      font-size: 28px;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: #1e1e1e;
      border: 1px solid #2d2d2d;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .titulo {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #ffffff;
    }

    textarea {
      width: 100%;
      height: 140px;
      background: #0f0f0f;
      color: #dcdcdc;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      resize: vertical;
      margin-bottom: 12px;
      outline: none;
    }

    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
      font-weight: bold;
    }

    button:hover {
      background: #2563eb;
    }

    .copiado {
      background: #16a34a !important;
    }
  </style>

      // TÍTULO

      titulo.className = "titulo";
      titulo.innerText = item.nome;

      // TEXTAREA
      const textarea = document.createElement("textarea");
      textarea.value = item.valor;
      textarea.readOnly = true;

      // BOTÃO
      const botao = document.createElement("button");
      botao.innerText = "Copiar Prompt";

      botao.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(textarea.value);

          botao.innerText = "Copiado!";
          botao.classList.add("copiado");

          setTimeout(() => {
            botao.innerText = "Copiar Prompt";
            botao.classList.remove("copiado");
          }, 2000);

        } catch (erro) {
          alert("Erro ao copiar.");
        }
      });

      // APPEND
      card.appendChild(titulo);
      card.appendChild(textarea);
      card.appendChild(botao);

      container.appendChild(card);
    });
