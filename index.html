<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suite de Serviços</title>

    <style>
        :root {
            --bg: #0f1115;
            --card: #1b1f27;
            --text: #e4e6eb;
            --muted: #9aa0a6;
            --accent: #4f8cff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #32456d;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px;
            border-bottom: 1px solid #2a2f3a;
        }

        header h1 {
            font-size: 1.4rem;
        }

        header span {
            color: var(--muted);
            font-size: 0.9rem;
        }

        main {

            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
        }

        .service-card {
            background: var(--card);
            border-radius: 8px;
            padding: 14px;
            cursor: pointer;
            transition: 0.2s ease;
            border: 1px solid transparent;
        }

        .service-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
        }

        .service-card h2 {
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .service-card p {
            font-size: 0.75rem;
        }

        footer {
            padding: 12px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--muted);
            border-top: 1px solid #2a2f3a;
        }
    </style>
</head>

<body>

    <header>
        <h1>Breso X Files</h1>
        <span>Central de acesso rápido</span>
    </header>

    <main id="services">

        <div class="service-card" onclick="openService('galeria_img.html')">
            <h2>📸 Imagens            </h2>
            <p>Exibe a galeria de imagens</p>
        </div>
        <div class="service-card" onclick="openService('netflix.html')">
            <h2>🎬 Videos            </h2>
            <p>Exibe a galeria de videos</p>
        </div>

        <div class="service-card" onclick="openService('gerador_prompt.html')">
            <h2>🛠 Prompt Creator</h2>
            <p>Criador de Prompts</p>
        </div>

        <div class="service-card" onclick="openService('promptTerror.html')">
            <h2>🛠 Prompt Creator - Terror</h2>
            <p>Criador de Prompts para Diabinhas</p>
        </div>

        <div class="service-card" onclick="openService('emails.html')">
            <h2>📧 Emails</h2>
            <p>Lista de emails válidos</p>
        </div>
         

    </main>

    <footer>
        © 2025 – Suite de Serviços
    </footer>

    <script>
        function openService(url) {
            window.location.href = url;
        }
    </script>

</body>

</html>
